*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--black)}

main{width:min(680px,100%);margin:auto;padding:58px 28px 42px;text-align:center}

.cta{display:inline-block;border:1px solid var(--gold);padding:15px 21px;color:var(--gold2);text-decoration:none;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.social{margin-top:31px;display:flex;justify-content:center;gap:26px;flex-wrap:wrap}
.social a{color:var(--muted);text-decoration:none;font-size:13px}
.social a:hover,.cta:hover{color:#050505;background:var(--gold)}
footer{margin-top:54px;color:#69645c;font-size:10px;letter-spacing:.22em}
@media(max-width:420px){main{padding:42px 22px 34px}.logo{width:92%}.since{margin-bottom:48px}.service{font-size:16px}}
